appId: com.conneqthealth.conneqt
---
- launchApp:
    clearState: true
- assertVisible:
    text: Welcome
- runFlow: subflows/demographics.flow.yaml
- assertVisible:
    text: Create Your Account
- takeScreenshot: assets/step-2.png
- assertVisible:
    text: Already have an account?
- tapOn:
    text: Already have an account?
- takeScreenshot: assets/step-3.png
- evalScript: ${output.api1 = http.get(BASE_URL + '/api')}
- assertTrue: ${output.api1.status == 200}
- assertVisible:
    text: Log In to Your Account
- assertVisible:
    text: Log In to Your Account
- assertVisible:
    text: Enter your account information to log in.
- launchApp:
    appId: com.conneqthealth.conneqt
    clearState: true
- pressKey: home
- tapOn:
    text: News
